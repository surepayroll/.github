name: Claude PR Review

on:
    pull_request:
        types: [opened, synchronize]
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write

jobs:
    claude:
        uses: surepayroll/package-github-actions-claude-review/.github/workflows/claude-review.yml@main
        secrets: inherit
